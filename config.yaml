# Reddit data needs approval from Reddit (see README, "Data sources and compliance").
# It stays off unless you have that approval.
reddit:
  enabled: false
  subreddits: [worldnews, technology, science, news, politics, health]
  posts_per_subreddit: 200
  comments_per_post: 50
  sleep_between_calls: 1.0      # seconds, stay well under the rate limit

youtube:
  queries: ["climate change", "vaccine safety", "election results", "artificial intelligence jobs",
            "inflation economy", "Ukraine war", "bitcoin price", "fact check", "conspiracy theory",
            "भारत समाचार", "noticias política", "nachrichten politik"]
  videos_per_query: 20          # 12 x 20 = ~240 videos, ~1,700 quota units of the 10,000/day
  comments_per_video: 50        # top-level threads; up to 5 replies each come along for free
  sleep_between_calls: 0.5

# hash author names before anything is stored/indexed (set AUTHOR_SALT in .env)
anonymize_authors: true

paths:
  raw: data/raw
  processed: data/processed

sentiment:
  model: cardiffnlp/twitter-xlm-roberta-base-sentiment
  batch_size: 32
  max_length: 128

# accuracy numbers from public datasets, run with: python -m socintel.run_pipeline benchmarks
benchmarks:
  tweeteval_n: 2000
  amazon_langs: [en, de, es, fr, ja, zh]
  amazon_n: 1000
  snap_path: data/snap/soc-redditHyperlinks-title.tsv

topics:
  embedding_model: paraphrase-multilingual-MiniLM-L12-v2
  min_topic_size: 15
  nr_bins: 20

misinfo:
  dataset: liar
  max_features: 50000

elasticsearch:
  index: socintel-posts

alerts:
  neg_spike_zscore: 2.0     # flag a topic-week when negative share is this many std above its mean
  freq: W                   # bucket size: D, W or M. Comments span years, so daily buckets are too thin
  min_posts: 15             # a topic-week needs at least this many posts to be judged
  influencer_top_n: 50